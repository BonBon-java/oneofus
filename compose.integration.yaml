services:
  postgres-integration:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oneofus_integration
      POSTGRES_USER: oneofus
      POSTGRES_PASSWORD: local-integration-only
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oneofus -d oneofus_integration"]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - oneofus-integration-postgres:/var/lib/postgresql/data
volumes:
  oneofus-integration-postgres:
