name: Deploy ONEOFUS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare static site
        run: |
          mkdir -p _site/assets
          cp index.html styles.css script.js countdown.js wallet.js favicon.svg .nojekyll _site/
          cp assets/earth-hero-opt.jpg _site/assets/
          cp assets/winner-earth-opt.jpg _site/assets/
          cp assets/journey-cool-opt.jpg _site/assets/
          cp assets/eclipse-opt.jpg _site/assets/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
