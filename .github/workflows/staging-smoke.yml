name: Staging smoke

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Public staging API base URL
        required: true
        type: string
      token_address:
        description: Deployed OneOfUs Staging USDT address
        required: true
        type: string
      transaction_hash:
        description: Optional staging transfer transaction hash to inspect
        required: false
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Verify public staging dependencies
        env:
          ARBITRUM_RPC_URL: ${{ secrets.STAGING_RPC_URL }}
          ARBITRUM_RPC_FALLBACK_URL: ${{ secrets.STAGING_RPC_FALLBACK_URL }}
          ONE_OF_US_PAYMENT_TOKEN_ADDRESS: ${{ inputs.token_address }}
          STAGING_API_URL: ${{ inputs.api_url }}
          STAGING_TRANSACTION_HASH: ${{ inputs.transaction_hash }}
        run: node scripts/staging-smoke.js
