name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    name: Node and backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Node tests
        run: npm test

  browser-tests:
    name: Browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser regressions
        run: npm run test:browser

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  payment-integration:
    name: PostgreSQL, Hardhat and payment E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start PostgreSQL, Hardhat and MockUSDT
        run: npm run local:integration:start

      - name: Run local integration suites
        run: |
          node scripts/audit-local.js \
            tests/drand.postgres.test.js \
            tests/draw-snapshot.postgres.test.js \
            tests/orchestrator.e2e.test.js \
            tests/payment-round.postgres.test.js \
            tests/payout.integration.test.js \
            tests/rollover-ticket-eligibility.postgres.test.js \
            tests/round-closing.postgres.test.js \
            tests/browser/payment-local.spec.js

      - name: Print service diagnostics
        if: failure()
        continue-on-error: true
        run: |
          docker compose -f compose.integration.yaml ps
          docker compose -f compose.integration.yaml logs --no-color
          if [ -f .local-integration/hardhat.log ]; then tail -n 500 .local-integration/hardhat.log; fi

      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: payment-integration-results
          path: |
            .local-integration/hardhat.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local integration stack
        if: always()
        run: npm run local:integration:reset
